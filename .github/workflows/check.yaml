name: Scheduled Check and Trigger

on:
  schedule:
    - cron: '0 3 * * *'  # 每天运行一次，可按需修改
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python Requests
      # 为 Github Actions ubnuntu-slim 及 Gitea Runner ubuntu 镜像安装 requests 库
        run: |
            if ! python3 -c "import requests" >/dev/null 2>&1; then
              echo "Python requests is not installed. Installing..."
              pip3 install requests
            fi

      - name: Run check script
        env:
          # 读取仓库 secret pat
          GITHUB_PAT: ${{ secrets.pat }}
        run: |
          python3 check.py
